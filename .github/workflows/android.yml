
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Source Code
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found!"
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP" -d source

      - name: Locate Project
        run: |
          FILE=$(find source -name settings.gradle.kts -print -quit)
          if [ -z "$FILE" ]; then
            echo "Gradle project not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GemQuest-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
